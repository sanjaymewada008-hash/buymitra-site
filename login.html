<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | BUYMITRA</title><link rel="stylesheet" href="login.css"></head><body><main><a href="index.html"><img src="buymitra-header-logo.svg" alt="BUYMITRA — Shop Smart, Live Better"></a><section class="card"><div class="tabs"><button class="active" data-mode="login">Login</button><button data-mode="register">Create account</button></div><p class="eyebrow">WELCOME TO BUYMITRA</p><h1 id="title">Sign in to continue</h1><p class="muted" id="subtitle">Use your Gmail/email or mobile number.</p><form id="authForm"><label>Email or mobile number<input id="identifier" required autocomplete="username" placeholder="you@gmail.com or +91 9876543210"></label><label>Password<input id="password" required minlength="6" type="password" autocomplete="current-password" placeholder="Minimum 6 characters"></label><button class="primary" type="submit" id="submit">Login <span>→</span></button><p id="message" aria-live="polite"></p></form><div class="owner-note"><strong>Owner login</strong><span>Username: owner@buymitra.local</span><span>Password: ChangeMe@123</span><small>Change these defaults using BUYMITRA_OWNER_USERNAME and BUYMITRA_OWNER_PASSWORD before production.</small></div></section></main><script src="login.js"></script></body></html>
