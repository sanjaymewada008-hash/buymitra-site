<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUYMITRA Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><img src="buymitra-header-logo.svg" alt="BUYMITRA"><a href="index.html">← Storefront</a></header><main><div class="intro"><div><p>CATALOG CONTROL</p><h1>Product management</h1></div><button id="newProduct">+ Add product</button></div><section class="metrics" id="metrics"></section><section class="panel"><div class="tools"><input id="adminSearch" placeholder="Search name, SKU, brand..."><select id="statusFilter"><option value="">All statuses</option><option value="published">Published</option><option value="draft">Draft</option><option value="hidden">Hidden</option><option value="out_of_stock">Out of stock</option></select></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section></main><dialog id="productDialog"><form id="productForm"><div class="dialog-head"><h2 id="formTitle">Add product</h2><button type="button" id="closeDialog">×</button></div><input type="hidden" id="productId"><div class="form-grid"><label>Product name<input id="name" required></label><label>SKU<input id="sku" required></label><label>Brand<input id="brand" value="BUYMITRA"></label><label>Category<select id="category" required></select></label><label>Subcategory<input id="subcategory"></label><label>Status<select id="status"><option>draft</option><option>published</option><option>hidden</option><option>out_of_stock</option><option>coming_soon</option></select></label><label>MRP (₹)<input id="mrp" type="number" min="0" required></label><label>Selling price (₹)<input id="price" type="number" min="0" required></label><label>Stock quantity<input id="stock" type="number" min="0" required></label><label>Low stock limit<input id="lowStockLimit" type="number" min="0" value="10"></label><label class="wide">Short description<textarea id="shortDescription"></textarea></label><label class="wide">Full description<textarea id="fullDescription"></textarea></label><label>Main image URL<input id="image" type="url" placeholder="https://..."></label><label>Powder image URL<input id="powderImage" type="url" placeholder="Optional powder image"></label><label class="wide">Upload image<input id="imageFile" type="file" accept="image/*"><img id="imagePreview" class="image-preview" alt="Product preview"></label><label class="wide">Additional image URLs<textarea id="images" placeholder="One image URL per line"></textarea></label><label class="wide">Tags (comma separated)<input id="tags"></label></div><div class="form-actions"><button type="button" id="cancelForm">Cancel</button><button class="primary" type="submit">Save product</button></div></form></dialog><script src="admin.js"></script></body></html>
